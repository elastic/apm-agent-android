---
version: 2
updates:

  # GitHub actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "22:00"
    labels:
      - "dependencies"
      - "oblt-aw/ai/merge-ready"
    exclude-paths:
      - ".github/workflows/trigger-*-aw-*.yml"
    groups:
      github-actions:
        patterns:
          - "*"
