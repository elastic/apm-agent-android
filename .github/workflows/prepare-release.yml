---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release-note JSON. Use the draft workflow or the release wizard.
        required: true
        type: string

permissions:
  contents: read

# One preparation at a time, so two dispatches cannot both pass the
# release-in-flight check before either has pushed its branches.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get automation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Prepare release changes
        id: prepare
        uses: elastic/oblt-actions/edot-release/prepare-start@v1
        with:
          notes: ${{ inputs.release_notes }}
          github-token: ${{ steps.token.outputs.token }}

      # Regenerate the NOTICE files in the working tree, so the preparation
      # commit ships them with the release changes.
      - name: Regenerate NOTICE files
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          if ! ./gradlew createNoticeFile; then
            echo "NOTICE generation failed. Update manual_licenses_map.txt for dependencies whose licenses cannot be resolved, then dispatch again." >&2
            exit 1
          fi

      - name: Open preparation pull request
        if: steps.prepare.outputs.prepared == 'true'
        uses: elastic/oblt-actions/edot-release/prepare-finish@v1
        with:
          release: ${{ steps.prepare.outputs.release }}
          github-token: ${{ steps.token.outputs.token }}
