---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release-note JSON. Use the draft workflow or the release wizard.
        required: true
        type: string
      bump:
        description: Release version bump.
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

permissions:
  contents: read

# One preparation at a time, so two dispatches cannot both pass the
# release-in-flight check before either has pushed its branches.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Prepare release must be dispatched from main."
          exit 1

      - name: Get automation token
        id: token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
          private_key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
          permissions: >-
            {
              "contents": "write",
              "pull_requests": "write"
            }
          repositories: >-
            ["apm-agent-android"]

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Prepare release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: .github/scripts/release/prepare-release.sh
