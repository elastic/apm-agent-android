---
name: Start patch

on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line in X.Y form.
        required: true
        type: string
      pull_requests:
        description: Optional comma- or space-separated main PR numbers.
        required: false
        type: string

permissions:
  contents: read

jobs:
  start-patch:
    name: Start patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Require main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Start patch must be dispatched from main."
          exit 1

      - name: Get automation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Start patch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LINE: ${{ inputs.line }}
          PULL_REQUESTS: ${{ inputs.pull_requests }}
        run: .github/scripts/release/start-patch.sh
